services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: chorizo
      POSTGRES_PASSWORD: chorizo
      POSTGRES_DB: chorizo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chorizo"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
